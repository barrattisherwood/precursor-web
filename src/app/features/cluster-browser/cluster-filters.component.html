<div class="filters">
  <div class="filter-group">
    <label class="filter-label">Facet</label>
    <div class="btn-group">
      @for (opt of facetOptions; track opt.value) {
        <button
          class="btn-filter"
          [class.active]="filters.facet === opt.value"
          (click)="setFacet(opt.value)">
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  <div class="filter-group">
    <label class="filter-label">Sort</label>
    <div class="btn-group">
      @for (opt of sortOptions; track opt.value) {
        <button
          class="btn-filter"
          [class.active]="filters.sortBy === opt.value"
          (click)="setSort(opt.value)">
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  <div class="filter-group filter-group--toggles">
    <button class="btn-toggle" [class.active]="filters.spiritFeasible" (click)="toggleSpirit()">
      Spirit feasible
    </button>
    <button class="btn-toggle" [class.active]="filters.leagueScoped" (click)="toggleLeague()">
      Include league
    </button>
  </div>
</div>
